# 反代 Artalk：comment.sayodevice.com -> 127.0.0.1:23366
# 放到 /etc/nginx/conf.d/artalk.conf
# （Artalk 与 Nginx 不同机时，把下面 127.0.0.1 改成 Artalk 所在机器 IP）
server {
    listen 443 ssl;
    server_name comment.sayodevice.com;

    # 通配符证书 *.sayodevice.com；路径按你实际证书位置修改
    ssl_certificate     /etc/letsencrypt/live/sayodevice.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sayodevice.com/privkey.pem;

    client_max_body_size 20m;   # 允许评论上传图片

    location / {
        proxy_pass http://127.0.0.1:23366;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;   # 关键：透传登录态（Artalk 用 Authorization: Bearer）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name comment.sayodevice.com;
    return 301 https://$host$request_uri;
}
